<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تنزيل السيرة الذاتية - مكتب الذياب</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}
.box{max-width:640px;margin:0 auto}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;direction:ltr;text-align:left}
button,a.b{display:inline-block;margin:6px 0 0 6px;padding:10px 14px;background:#0a7d3b;color:#fff;border:0;border-radius:8px;text-decoration:none;font-size:15px;font-family:inherit}
.g{background:#666}
.s{font-size:13px;color:#555}
.err{color:#b00020;font-size:14px;margin-top:8px}
.hide{display:none!important}
#cv{background:#fff;border:1px solid #ddd;padding:18px;border-radius:8px}
#cv h3{margin:0;font-size:22px;color:#12305a}
#cv h4{margin:14px 0 4px;color:#12305a;border-bottom:2px solid #c9a227;padding-bottom:3px;font-size:15px}
#cv p,#cv li{font-size:14px;margin:3px 0}
.pic{float:left;width:90px;height:90px;object-fit:cover;border-radius:8px;margin:0 12px 8px 0}
@media print{body{background:#fff;padding:0}.noprint{display:none!important}#cvWrap{display:block!important;padding:0}#cv{border:0;padding:0}}
</style>
</head>
<body>
<div class="box">
<h1 class="noprint">تنزيل السيرة الذاتية</h1>
<div class="card noprint">
<label>اكتب رمز الطلب اللي أخدته بعد الدفع</label>
<input id="code" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
<button type="button" id="btnGo">عرض سيرتي الذاتية</button>
<div class="err" id="err"></div>
</div>
<div id="cvWrap" class="card hide"><div id="cv"></div></div>
<div id="actions" class="hide noprint">
<button type="button" id="btnPdf">تنزيل PDF</button>
<p class="s">بعد الضغط، اختار "حفظ كملف PDF" (Save as PDF) من نافذة الطباعة.</p>
</div>
<a class="b g noprint" href="index.html">الرئيسية</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="download.js"></script>
</body>
</html>
